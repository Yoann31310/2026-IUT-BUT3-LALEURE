name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: td
        run: npm ci || npm install
      - name: Build
        working-directory: td
        run: npm run build
      - name: Run tests
        working-directory: td
        run: npm test
